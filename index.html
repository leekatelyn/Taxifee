<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>的士費報銷紀錄系統</title>
  <!-- Tailwind CSS & Tesseract.js & Supabase JS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 未通過密碼驗證前隱藏主要內容 */
    #mainContent { display: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 min-h-screen">

  <!-- 密碼輸入解鎖介面 -->
  <div id="passwordAuth" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow-md text-center">
    <h2 class="text-xl font-bold mb-4 text-gray-800">🔒 受保護的系統</h2>
    <p class="text-sm text-gray-600 mb-4">請輸入密碼以存取單據資料：</p>
    <input type="password" id="passInput" placeholder="請輸入密碼" class="border p-2 rounded w-full mb-4 text-center text-lg">
    <button onclick="checkPassword()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold w-full hover:bg-blue-700">
      解鎖系統
    </button>
    <p id="passError" class="text-red-500 text-sm mt-2 hidden">❌ 密碼不正確，請重試！</p>
  </div>

  <!-- 主要網頁內容 (解鎖後顯示) -->
  <div id="mainContent" class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-blue-600">🚕 的士費報銷紀錄</h1>
      <button onclick="lockSystem()" class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded">🔒 重新上鎖</button>
    </div>
    
    <!-- 1. 上載與 OCR 區域 -->
    <div class="border-2 border-dashed border-blue-300 p-6 rounded-lg text-center bg-blue-50 mb-6">
      <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="handleFiles(this.files)">
      <label for="fileInput" class="bg-blue-600 text-white px-6 py-2 rounded-lg cursor-pointer hover:bg-blue-700 font-semibold inline-block">
        📷 選擇單據相片 / 即時影相 (可多選)
      </label>
      <div id="status" class="mt-3 text-sm font-medium text-gray-600"></div>
    </div>

    <!-- 2. 每月進度條與統計 -->
    <div id="statsSection" class="mb-6 space-y-4"></div>

    <!-- 3. 單據列表 -->
    <h2 class="text-lg font-bold mb-2">單據明細列表</h2>
    <div id="receiptsList" class="space-y-3">
      <p class="text-gray-400 text-center py-4">載入中 / 暫無資料...</p>
    </div>
  </div>

  <!-- 編輯彈窗 (Modal) -->
  <div id="editModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4">
    <div class="bg-white p-6 rounded-xl w-full max-w-md">
      <h3 class="text-lg font-bold mb-4">✏️ 編輯單據資料</h3>
      <input type="hidden" id="editId">
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700">日期</label>
          <input type="date" id="editDate" class="w-full border rounded p-2 mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">金額 (HKD)</label>
          <input type="number" step="0.1" id="editAmount" class="w-full border rounded p-2 mt-1">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">備註/行程</label>
          <input type="text" id="editNote" class="w-full border rounded p-2 mt-1">
        </div>
      </div>
      <div class="mt-5 flex justify-end space-x-2">
        <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded">取消</button>
        <button onclick="saveEdit()" class="px-4 py-2 bg-blue-600 text-white rounded">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // 🔒 系統解鎖密碼已更新為 0523
    const SECRET_PASSWORD = "0523";

    // 驗證密碼邏輯
    function checkPassword() {
      const inputPass = document.getElementById('passInput').value;
      if (inputPass === SECRET_PASSWORD) {
        localStorage.setItem('taxi_auth', 'true');
        showMainContent();
      } else {
        document.getElementById('passError').classList.remove('hidden');
      }
    }

    function showMainContent() {
      document.getElementById('passwordAuth').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      loadData();
    }

    function lockSystem() {
      localStorage.removeItem('taxi_auth');
      location.reload();
    }

    // 初始化 check 密碼
    window.onload = function() {
      if (localStorage.getItem('taxi_auth') === 'true') {
        showMainContent();
      }
    };

    // ⚠️ 如需跨裝置同步，可填入 Supabase Credentials
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = (SUPABASE_URL !== "YOUR_SUPABASE_URL") ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let localData = JSON.parse(localStorage.getItem('taxi_receipts') || '[]');

    async function loadData() {
      if (supabaseClient) {
        const { data, error } = await supabaseClient.from('receipts').select('*').order('date', { ascending: false });
        if (!error && data) localData = data;
      }
      render();
    }

    async function saveData(item) {
      if (supabaseClient) {
        await supabaseClient.from('receipts').insert([item]);
        loadData();
      } else {
        localData.push(item);
        localStorage.setItem('taxi_receipts', JSON.stringify(localData));
        render();
      }
    }

    // 處理多圖批量 OCR 辨識
    async function handleFiles(files) {
      const statusDiv = document.getElementById('status');
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusDiv.innerText = `⏳ 正在處理第 ${i + 1}/${files.length} 張單據...`;
        
        const imageBase64 = await convertToBase64(file);
        
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(file);
        await worker.terminate();

        const text = ret.data.text;
        const amountMatch = text.match(/(\$|\b)\d+(\.\d{1,2})?\b/);
        const amount = amountMatch ? parseFloat(amountMatch[0].replace('$', '')) : 0;
        const dateStr = new Date().toISOString().split('T')[0];

        const newItem = {
          id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
          date: dateStr,
          amount: amount,
          image: imageBase64,
          note: '的士單據',
          month: dateStr.substring(0, 7)
        };

        await saveData(newItem);
      }
      statusDiv.innerText = '✅ 所有單據處理完成！';
    }

    function convertToBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    // 計算每月 $500 額度與自動標示剔走
    function render() {
      const receiptsList = document.getElementById('receiptsList');
      const statsSection = document.getElementById('statsSection');
      
      localData.sort((a, b) => new Date(b.date) - new Date(a.date));

      const monthlyTotals = {};
      localData.forEach(item => {
        const month = item.date.substring(0, 7);
        if (!monthlyTotals[month]) monthlyTotals[month] = 0;
      });

      statsSection.innerHTML = Object.keys(monthlyTotals).map(month => {
        let total = 0;
        localData.filter(i => i.date.startsWith(month)).reverse().forEach(i => total += Number(i.amount));
        const isOver = total > 500;
        return `
          <div class="bg-gray-50 p-4 rounded-lg border">
            <div class="flex justify-between font-bold mb-1">
              <span>📅 ${month}</span>
              <span class="${isOver ? 'text-red-600' : 'text-green-600'}">已用: HK$${total.toFixed(1)} / $500.0</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
              <div class="h-2.5 rounded-full ${isOver ? 'bg-red-500' : 'bg-blue-600'}" style="width: ${Math.min((total/500)*100, 100)}%"></div>
            </div>
            ${isOver ? '<p class="text-xs text-red-500 mt-1">⚠️ 累計已超過 HK$500 報銷上限</p>' : ''}
          </div>
        `;
      }).join('');

      let runningTotals = {};
      const renderedList = localData.map(item => {
        const month = item.date.substring(0, 7);
        if (!runningTotals[month]) runningTotals[month] = 0;
        
        runningTotals[month] += Number(item.amount);
        const isQualified = runningTotals[month] <= 500;

        return `
          <div class="flex items-center justify-between p-3 bg-white border rounded-lg shadow-sm ${!isQualified ? 'opacity-60 bg-red-50' : ''}">
            <div class="flex items-center space-x-3">
              <img src="${item.image}" class="w-12 h-12 object-cover rounded border cursor-pointer" onclick="window.open('${item.image}')" title="點擊放大">
              <div>
                <div class="font-bold text-gray-800">HK$ ${item.amount}</div>
                <div class="text-xs text-gray-500">${item.date} | ${item.note || ''}</div>
                <span class="text-xs px-2 py-0.5 rounded ${isQualified ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                  ${isQualified ? '✅ $500 額度內' : '❌ 已超出 (自動剔走)'}
                </span>
              </div>
            </div>
            <div class="space-x-1">
              <button onclick="openEdit('${item.id}')" class="text-sm bg-gray-100 p-1.5 rounded hover:bg-gray-200">✏️</button>
              <button onclick="deleteItem('${item.id}')" class="text-sm bg-red-100 text-red-600 p-1.5 rounded hover:bg-red-200">🗑️</button>
            </div>
          </div>
        `;
      }).join('');

      receiptsList.innerHTML = renderedList || '<p class="text-gray-400 text-center py-4">暫無單據紀錄</p>';
    }

    function openEdit(id) {
      const item = localData.find(i => i.id === id);
      if (!item) return;
      document.getElementById('editId').value = item.id;
      document.getElementById('editDate').value = item.date;
      document.getElementById('editAmount').value = item.amount;
      document.getElementById('editNote').value = item.note || '';
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').classList.remove('flex');
    }

    async function saveEdit() {
      const id = document.getElementById('editId').value;
      const date = document.getElementById('editDate').value;
      const amount = parseFloat(document.getElementById('editAmount').value);
      const note = document.getElementById('editNote').value;

      if (supabaseClient) {
        await supabaseClient.from('receipts').update({ date, amount, note }).eq('id', id);
        loadData();
      } else {
        const item = localData.find(i => i.id === id);
        if (item) { item.date = date; item.amount = amount; item.note = note; }
        localStorage.setItem('taxi_receipts', JSON.stringify(localData));
        render();
      }
      closeModal();
    }

    async function deleteItem(id) {
      if (!confirm('確定要刪除這張單據嗎？')) return;
      if (supabaseClient) {
        await supabaseClient.from('receipts').delete().eq('id', id);
        loadData();
      } else {
        localData = localData.filter(i => i.id !== id);
        localStorage.setItem('taxi_receipts', JSON.stringify(localData));
        render();
      }
    }
  </script>
</body>
</html>
