<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>的士費報銷紀錄系統 (Drive 相片同步)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tesseract.js OCR 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style> #mainContent { display: none; } </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 min-h-screen">

  <!-- 密碼輸入解鎖 -->
  <div id="passwordAuth" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow-md text-center">
    <h2 class="text-xl font-bold mb-4 text-gray-800">🔒 受保護的系統</h2>
    <p class="text-sm text-gray-600 mb-4">請輸入密碼以存取單據資料：</p>
    <input type="password" id="passInput" placeholder="請輸入密碼" class="border p-2 rounded w-full mb-4 text-center text-lg" onkeyup="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold w-full hover:bg-blue-700">解鎖系統</button>
    <p id="passError" class="text-red-500 text-sm mt-2 hidden">❌ 密碼不正確，請重試！</p>
  </div>

  <!-- 主要內容區 -->
  <div id="mainContent" class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-blue-600">🚕 的士費報銷紀錄</h1>
      <div class="flex items-center space-x-2">
        <button onclick="fetchDriveData()" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded font-medium hover:bg-green-200">🔄 實時同步</button>
        <button onclick="lockSystem()" class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded">🔒 重新上鎖</button>
      </div>
    </div>
    
    <div class="border-2 border-dashed border-blue-300 p-6 rounded-lg text-center bg-blue-50 mb-6">
      <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="handleFiles(this.files)">
      <label for="fileInput" class="bg-blue-600 text-white px-6 py-2 rounded-lg cursor-pointer hover:bg-blue-700 font-semibold inline-block shadow">
        📷 選擇單據相片 / 即時影相 (自動入 Drive)
      </label>
      <div id="status" class="mt-3 text-sm font-medium text-gray-600"></div>
    </div>

    <div id="statsSection" class="mb-6 space-y-4"></div>

    <div class="flex justify-between items-center mb-2">
      <h2 class="text-lg font-bold">單據明細列表</h2>
      <span id="syncStatus" class="text-xs text-gray-400">連線至 Google Drive...</span>
    </div>
    <div id="receiptsList" class="space-y-3">
      <p class="text-gray-400 text-center py-4">載入中...</p>
    </div>
  </div>

  <script>
    const SECRET_PASSWORD = "0523";
    // ⚠️ 你的 Google Apps Script Web App 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzTnI_ZwWSHhSxNYvigzZF3JEVHeRWdKmO-Oj6LmYOetLX1HpE57iDRFmSN8AmImdUIRA/exec";

    let localData = [];

    function checkPassword() {
      if (document.getElementById('passInput').value === SECRET_PASSWORD) {
        localStorage.setItem('taxi_auth', 'true');
        showMainContent();
      } else {
        document.getElementById('passError').classList.remove('hidden');
      }
    }

    function showMainContent() {
      document.getElementById('passwordAuth').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      fetchDriveData();
    }

    function lockSystem() {
      localStorage.removeItem('taxi_auth');
      location.reload();
    }

    window.onload = function() {
      if (localStorage.getItem('taxi_auth') === 'true') showMainContent();
    };

    // 📡 使用 JSONP 從 Drive 讀取資料
    function fetchDriveData() {
      const syncStatus = document.getElementById('syncStatus');
      if (syncStatus) syncStatus.innerText = '🔄 同步 Drive 資料中...';
      
      const callbackName = 'jsonpCallback_' + Date.now();
      window[callbackName] = function(data) {
        localData = Array.isArray(data) ? data : [];
        if (syncStatus) syncStatus.innerText = '✅ 已成功同步 Google Drive';
        render();
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };

      const script = document.createElement('script');
      script.src = GAS_API_URL + '?callback=' + callbackName;
      script.onerror = function() {
        if (syncStatus) syncStatus.innerText = '⚠️ 同步失敗，請檢查網址';
        delete window[callbackName];
      };
      document.body.appendChild(script);
    }

    function parseReceiptText(text) {
      let dateStr = new Date().toISOString().split('T')[0];
      const dateMatch = text.match(/(202[3-9][\/\.-]\d{1,2}[\/\.-]\d{1,2})|(\d{1,2}[\/\.-]\d{1,2}[\/\.-]202[3-9])/);
      if (dateMatch) {
        let rawDate = dateMatch[0].replace(/[\.]/g, '/');
        try {
          let d = new Date(rawDate);
          if (!isNaN(d.getTime())) dateStr = d.toISOString().split('T')[0];
        } catch(e){}
      }

      let amount = 0;
      let foundNumbers = [];
      text.split('\n').forEach(line => {
        let uppercaseLine = line.toUpperCase();
        if (uppercaseLine.includes('TOTAL') || uppercaseLine.includes('HK') || uppercaseLine.includes('$') || uppercaseLine.includes('車費') || uppercaseLine.includes('金額')) {
          let nums = line.match(/\d+(\.\d{1,2})?/g);
          if (nums) nums.forEach(n => { let val = parseFloat(n); if (val >= 10 && val <= 1000) foundNumbers.push(val); });
        }
      });

      if (foundNumbers.length === 0) {
        let allNums = text.match(/\b\d{2,3}(\.\d{1,2})?\b/g);
        if (allNums) allNums.forEach(n => { let val = parseFloat(n); if (val >= 24 && val <= 800) foundNumbers.push(val); });
      }

      if (foundNumbers.length > 0) amount = Math.max(...foundNumbers);
      return { date: dateStr, amount: amount };
    }

    async function handleFiles(files) {
      const statusDiv = document.getElementById('status');
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusDiv.innerText = `⏳ 分析中並上傳第 ${i + 1}/${files.length} 張相片至 Google Drive...`;
        const imageBase64 = await convertToBase64AndCompress(file);
        
        let parsed = { date: new Date().toISOString().split('T')[0], amount: 0 };
        try {
          // [FIX 1] 改為中英文雙語辨識 (chi_tra+eng)，提升香港單據中文「車費/金額」辨識率
          const worker = await Tesseract.createWorker(['chi_tra', 'eng']);
          const ret = await worker.recognize(imageBase64);
          await worker.terminate();
          parsed = parseReceiptText(ret.data.text);
        } catch(e){}

        const newItem = {
          id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
          date: parsed.date,
          amount: parsed.amount,
          image: imageBase64,
          note: parsed.amount === 0 ? '需手動確認金額' : '自動辨識'
        };

        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(newItem)
        });
      }
      statusDiv.innerText = '✅ 相片已成功儲存至 Google Drive！';
      setTimeout(fetchDriveData, 2000);
    }

    function convertToBase64AndCompress(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height, max = 700;
            if (width > height && width > max) { height = Math.round((height * max) / width); width = max; }
            else if (height > max) { width = Math.round((width * max) / height); height = max; }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function render() {
      const receiptsList = document.getElementById('receiptsList');
      const statsSection = document.getElementById('statsSection');

      // [FIX 2] 先按日期「由舊至新（時間順序）」排序，正確依時序累加金額
      const chronologicalData = [...localData].sort((a, b) => new Date(a.date) - new Date(b.date));

      const monthlyRunningTotals = {};
      const itemStatusMap = {};

      chronologicalData.forEach(item => {
        const month = String(item.date).substring(0, 7);
        if (!monthlyRunningTotals[month]) monthlyRunningTotals[month] = 0;

        monthlyRunningTotals[month] += Number(item.amount);
        
        // 如果該單據累加後超過 500，標記為超額
        const isOver = monthlyRunningTotals[month] > 500;
        itemStatusMap[item.id] = {
          isOver: isOver,
          currentTotal: monthlyRunningTotals[month]
        };
      });

      // [FIX 3] 列表顯示時，改回按「最新日期在前」排序
      localData.sort((a, b) => new Date(b.date) - new Date(a.date));

      // 繪製月度總額統計卡片
      const monthlyTotals = {};
      localData.forEach(item => { 
        if (item.date) monthlyTotals[String(item.date).substring(0, 7)] = 0; 
      });

      statsSection.innerHTML = Object.keys(monthlyTotals).map(month => {
        let total = 0;
        localData.filter(i => String(i.date).startsWith(month)).forEach(i => total += Number(i.amount));
        const isOver = total > 500;
        return `
          <div class="bg-gray-50 p-4 rounded-lg border">
            <div class="flex justify-between font-bold mb-1">
              <span>📅 ${month}</span>
              <span class="${isOver ? 'text-red-600 font-extrabold' : 'text-green-600'}">本月總計: HK$${total.toFixed(1)} / $500.0</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
              <div class="h-2.5 rounded-full ${isOver ? 'bg-red-500' : 'bg-blue-600'}" style="width: ${Math.min((total/500)*100, 100)}%"></div>
            </div>
            ${isOver ? '<p class="text-xs text-red-500 mt-1">⚠️ 本月累計金額已超過 HK$500 報銷上限！</p>' : ''}
          </div>
        `;
      }).join('');

      // [FIX 4] 繪製單據明細列表：超額金額與卡片會以紅色醒目標示
      receiptsList.innerHTML = localData.map(item => {
        const status = itemStatusMap[item.id] || { isOver: false, currentTotal: 0 };
        const isOver = status.isOver;

        return `
          <div class="flex items-center justify-between p-3 border rounded-lg shadow-sm transition-all ${isOver ? 'bg-red-50 border-red-200' : 'bg-white border-gray-200'}">
            <div class="flex items-center space-x-3">
              <img src="${item.image}" class="w-12 h-12 object-cover rounded border cursor-pointer hover:opacity-80" onclick="window.open('${item.image}')" title="點擊檢視原始相片">
              <div>
                <div class="font-bold text-lg ${isOver ? 'text-red-600 font-extrabold' : 'text-gray-800'}">
                  HK$ ${item.amount}
                </div>
                <div class="text-xs text-gray-500">${item.date} | ${item.note || ''}</div>
                
                <div class="mt-1">
                  <span class="text-xs px-2 py-0.5 rounded font-medium ${isOver ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
                    ${isOver ? '⚠️ 超出 HK$500 上限 (累計: HK$' + status.currentTotal.toFixed(1) + ')' : '✅ 額度內 (累計: HK$' + status.currentTotal.toFixed(1) + ')'}
                  </span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('') || '<p class="text-gray-400 text-center py-4">暫無單據紀錄</p>';
    }
  </script>
</body>
</html>
